<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отчёт ПТО — 15.08</title>
<style>
/* ── палитра: валидированная (validate_palette.js, light+dark, --pairs all) ── */
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --seq100:#cde2fb; --seq250:#86b6ef; --seq400:#3987e5; --seq550:#1c5cab; --seq700:#0d366b;
  --chip:#f0efec;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --chip:#26262b;
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --chip:#26262b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
 font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
 padding:26px 20px 70px;position:relative;overflow-x:hidden}

/* ── фоновая анимация: медленно дрейфующие пятна, строго за карточками ── */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.16;
 will-change:transform}
#bg span:nth-child(1){width:44vw;height:44vw;left:-8vw;top:-10vw;
 background:var(--s1);animation:drift1 44s ease-in-out infinite alternate}
#bg span:nth-child(2){width:38vw;height:38vw;right:-6vw;top:14vh;
 background:var(--s3);animation:drift2 58s ease-in-out infinite alternate}
#bg span:nth-child(3){width:34vw;height:34vw;left:26vw;bottom:-12vw;
 background:var(--s2);animation:drift3 52s ease-in-out infinite alternate;opacity:.11}
@keyframes drift1{to{transform:translate3d(14vw,10vh,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-12vw,16vh,0) scale(.88)}}
@keyframes drift3{to{transform:translate3d(10vw,-12vh,0) scale(1.2)}}
@media(prefers-reduced-motion:reduce){#bg span{animation:none}}

.wrap{max-width:1200px;margin:0 auto}
h1{font-size:25px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 3px} h3{font-size:14px;margin:18px 0 8px;color:var(--ink2)}
.sub{color:var(--ink2);font-size:13px;margin-bottom:20px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:13px 15px}
.kpi .v{font-size:23px;font-weight:600;line-height:1.15}
.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
.kpi .d{font-size:12px;margin-top:3px}
.hero{background:var(--surface);border:1px solid var(--ring);border-radius:12px;
 padding:18px 20px;margin:10px 0 0}
.hero .n{font-size:52px;font-weight:650;line-height:1;letter-spacing:-.02em}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 14px}
button{font:inherit;cursor:pointer}
.tab{background:var(--surface);border:1px solid var(--ring);color:var(--ink);
 border-radius:999px;padding:7px 16px;font-size:14px;transition:background .15s}
.tab:hover{background:var(--chip)}
.tab[aria-selected=true]{background:var(--s1);border-color:var(--s1);color:#fff}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;
 padding:16px 18px;margin-bottom:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:600px}
th,td{border-bottom:1px solid var(--grid);padding:7px 9px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;
 letter-spacing:.04em;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th:hover{color:var(--s1)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--chip)}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px}
.ok{color:var(--good);font-weight:600}.warnc{color:var(--warn)}.badc{color:var(--crit)}
.mut{color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select,input{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);
 border:1px solid var(--ring);border-radius:8px;padding:5px 10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 10px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;
 vertical-align:-1px}
.hide{display:none}
svg.chartsvg{display:block;width:100%;height:auto;overflow:visible}
.legend svg{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);
 border:1px solid var(--ring);border-radius:9px;padding:8px 11px;font-size:12.5px;
 box-shadow:0 6px 22px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;z-index:50;
 max-width:280px}
.tip b{font-weight:600}
ul.log{margin:0;padding-left:0;list-style:none}
ul.log li{margin-bottom:14px;padding-left:16px;border-left:2px solid var(--grid);position:relative}
ul.log li:before{content:'';position:absolute;left:-5px;top:6px;width:8px;height:8px;
 border-radius:50%;background:var(--s1);border:2px solid var(--surface)}
ul.log .t{font-size:12px;color:var(--muted)}
ul.log .e{font-size:13px;margin-top:3px}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.tblbtn{background:none;border:none;color:var(--s1);font-size:12.5px;padding:2px 0;
 text-decoration:underline}
</style>

</div>

<!-- Данные подставляются сюда сборщиком (build_report_0815.py). Блок с типом
     application/json НЕ исполняется как код, поэтому сам шаблон остаётся
     валидной страницей и открывается без ошибок — просто с пустым отчётом. -->
<script id="reportdata" type="application/json">__DATA__</script>
<script>
let DATA;
try{
  DATA = JSON.parse(document.getElementById('reportdata').textContent);
}catch(e){
  DATA = null;
}
if(!DATA || !DATA.runs){
  document.querySelector('.wrap').innerHTML =
    '<h1>Это шаблон, а не отчёт</h1><div class="card">'
    +'<p>Файл <code>report_template.html</code> — заготовка: данные в него ещё не '
    +'подставлены, поэтому показывать нечего.</p>'
    +'<p>Готовый отчёт лежит рядом и называется <code>ОТЧЁТ_2026-08-15.html</code>. '
    +'Пересобрать его можно командой <code>python build_report_0815.py --all</code>.</p></div>';
  throw new Error('template opened directly — nothing to render');
}
const RUNS = DATA.runs;
const $ = (s,r)=>(r||document).querySelector(s);
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S = ['var(--s1)','var(--s2)','var(--s3)'];
const fmt=(v,d=1)=>v===null||v===undefined?'н/д':(+v).toFixed(d);
const pctTxt=v=>v===null||v===undefined?'<span class=mut>н/д</span>'
  :`<span class="${v>=90?'ok':v>=70?'warnc':'badc'}">${(+v).toFixed(1)}%</span>`;
const secs=s=>s>=60?`${Math.floor(s/60)}м ${Math.round(s%60)}с`:`${(+s).toFixed(1)}с`;
const money=c=>c===null||c===undefined?'<span class=mut>н/д</span>':'$'+(+c).toFixed(4);

// ── тултип ────────────────────────────────────────────────────────────
const tip=$('#tip');
function bindTip(el,html){
  el.style.cursor='default';
  el.addEventListener('mouseenter',e=>{tip.innerHTML=html;tip.style.opacity=1;});
  el.addEventListener('mousemove',e=>{
    const r=tip.getBoundingClientRect();
    let x=e.clientX+14, y=e.clientY-10;
    if(x+r.width>innerWidth-8) x=e.clientX-r.width-14;
    if(y+r.height>innerHeight-8) y=innerHeight-r.height-8;
    tip.style.left=x+'px'; tip.style.top=Math.max(8,y)+'px';
  });
  el.addEventListener('mouseleave',()=>tip.style.opacity=0);
  el.setAttribute('tabindex','0');
  el.addEventListener('focus',()=>{
    const b=el.getBoundingClientRect();
    tip.innerHTML=html;tip.style.opacity=1;
    tip.style.left=b.left+'px';tip.style.top=(b.bottom+8)+'px';});
  el.addEventListener('blur',()=>tip.style.opacity=0);
}
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

// ── таблица с сортировкой (табличный двойник каждого графика) ─────────
function table(rows,cols,sortKey){
  let sk=sortKey||cols[0].k, sdir=-1;
  const box=document.createElement('div'); box.className='scroll';
  const t=document.createElement('table'); box.appendChild(t);
  function draw(){
    const sorted=[...rows].sort((a,b)=>{
      const x=a[sk],y=b[sk];
      if(x===y)return 0;
      if(x===null||x===undefined)return 1;
      if(y===null||y===undefined)return -1;
      return (typeof x==='number'&&typeof y==='number')?(x-y)*sdir
        :String(x).localeCompare(String(y))*sdir;
    });
    t.innerHTML='<thead><tr>'+cols.map(c=>
      `<th class="${c.num?'num':''}" data-k="${c.k}">${c.t}${sk===c.k?(sdir<0?' ▾':' ▴'):''}</th>`
      ).join('')+'</tr></thead><tbody>'+
      sorted.map(r=>'<tr>'+cols.map(c=>
        `<td class="${c.num?'num':''}">${c.f?c.f(r[c.k],r):esc(r[c.k]??'')}</td>`).join('')+'</tr>').join('')+
      '</tbody>';
    t.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const k=th.dataset.k; if(k===sk)sdir=-sdir; else{sk=k;sdir=-1;} draw();});
  }
  draw(); return box;
}
function withTable(chartEl,tableEl,label){
  const w=document.createElement('div'); w.appendChild(chartEl);
  const b=document.createElement('button'); b.className='tblbtn';
  b.textContent='Показать таблицей'; const box=document.createElement('div');
  box.className='hide'; box.style.marginTop='10px'; box.appendChild(tableEl);
  b.onclick=()=>{const h=box.classList.toggle('hide');
    b.textContent=h?'Показать таблицей':'Скрыть таблицу';};
  w.appendChild(b); w.appendChild(box); return w;
}

// ── СГРУППИРОВАННЫЕ СТОЛБЦЫ: метрики × модели ─────────────────────────
function groupedBars(groups, series, opts){
  opts=opts||{};
  const W=760, padL=52, padR=14, padT=14, padB=52;
  const H=opts.h||280, plotW=W-padL-padR, plotH=H-padT-padB;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,role:'img',class:'chartsvg'});
  const max=opts.max||100;
  const y=v=>padT+plotH-(v/max)*plotH;
  // сетка — сплошные волосяные линии
  for(let i=0;i<=4;i++){
    const v=max*i/4;
    mk('line',{x1:padL,x2:W-padR,y1:y(v),y2:y(v),stroke:'var(--grid)','stroke-width':1},svg);
    mk('text',{x:padL-8,y:y(v)+4,'text-anchor':'end',fill:'var(--muted)',
      'font-size':11,'font-variant-numeric':'tabular-nums'},svg).textContent=v+'%';
  }
  const gW=plotW/groups.length, inner=gW*0.56, bw=inner/series.length;
  groups.forEach((g,gi)=>{
    const gx=padL+gi*gW+(gW-inner)/2;
    series.forEach((s,si)=>{
      const v=s.values[gi];
      if(v===null||v===undefined) return;
      const bx=gx+si*bw, bh=Math.max(2,(v/max)*plotH);
      // 2px зазор между соседними столбцами — цветом поверхности
      const r=mk('rect',{x:bx+1,y:y(v),width:Math.max(1,bw-2),height:bh,
        rx:4,fill:S[si%3]},svg);
      bindTip(r,`<b>${esc(s.name)}</b><br>${esc(g)}: ${fmt(v)}%`);
      if(bw>26) mk('text',{x:bx+bw/2,y:y(v)-6,'text-anchor':'middle',
        fill:'var(--ink2)','font-size':10.5,'font-variant-numeric':'tabular-nums'},
        svg).textContent=fmt(v,0);
    });
    const lbl=mk('text',{x:padL+gi*gW+gW/2,y:H-padB+18,'text-anchor':'middle',
      fill:'var(--ink2)','font-size':11.5},svg);
    String(g).split(' ').forEach((word,wi)=>{
      mk('tspan',{x:padL+gi*gW+gW/2,dy:wi?13:0},lbl).textContent=word;
    });
  });
  mk('line',{x1:padL,x2:W-padR,y1:y(0),y2:y(0),stroke:'var(--axis)','stroke-width':1},svg);
  return svg;
}

// ── ТЕПЛОКАРТА: страница × метрика (последовательная шкала, один тон) ──
function heatmap(rows, cols, opts){
  opts=opts||{};
  const cw=Math.max(74,Math.min(120,(760-90)/cols.length)), ch=27;
  const padL=92, padT=42;
  const W=padL+cols.length*cw+14, H=padT+rows.length*ch+16;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,role:'img',class:'chartsvg'});
  const steps=['var(--seq100)','var(--seq250)','var(--seq400)','var(--seq550)','var(--seq700)'];
  const col=v=>v===null||v===undefined?'var(--chip)'
    :steps[Math.min(4,Math.max(0,Math.floor(((v-50)/50)*5)))];
  cols.forEach((c,ci)=>{
    const t=mk('text',{x:padL+ci*cw+cw/2,y:padT-14,'text-anchor':'middle',
      fill:'var(--muted)','font-size':11},svg);
    t.textContent=c.t;
  });
  rows.forEach((r,ri)=>{
    mk('text',{x:padL-10,y:padT+ri*ch+18,'text-anchor':'end',fill:'var(--ink2)',
      'font-size':11.5,'font-variant-numeric':'tabular-nums'},svg)
      .textContent=r.label;
    cols.forEach((c,ci)=>{
      const v=r[c.k];
      // 2px зазор поверхностью вместо обводки
      const cell=mk('rect',{x:padL+ci*cw+1,y:padT+ri*ch+1,width:cw-2,height:ch-2,
        rx:4,fill:col(v)},svg);
      bindTip(cell,`<b>стр. ${esc(r.page)}</b><br>${esc(c.t)}: ${fmt(v)}%`
        +(r.halluc&&r.halluc.length&&c.k==='prec'
          ? `<br><span style="color:var(--muted)">лишние числа: ${esc(r.halluc.join(', '))}</span>`:''));
      const dark = v!==null&&v!==undefined&&v>=80;
      mk('text',{x:padL+ci*cw+cw/2,y:padT+ri*ch+18,'text-anchor':'middle',
        fill:dark?'#fff':'var(--ink)','font-size':11,
        'font-variant-numeric':'tabular-nums'},svg)
        .textContent=v===null||v===undefined?'н/д':(+v).toFixed(0)+'%';
    });
  });
  return svg;
}

// ── ТОЧЕЧНАЯ: качество против стоимости (один тон + прямые подписи) ───
function scatter(pts, opts){
  opts=opts||{};
  const W=760,H=opts.h||300,padL=52,padR=90,padT=16,padB=46;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  // стоимость страницы различается на два порядка → логарифмическая ось X,
  // иначе все серверные модели слипаются в одну точку у нуля
  const lx=v=>Math.log10(Math.max(v,1e-6));
  const x0=Math.floor(lx(Math.min(...xs))*2)/2, x1=Math.ceil(lx(Math.max(...xs))*2)/2;
  const ymin=Math.max(0,Math.min(...ys)-10), ymax=Math.min(100,Math.max(...ys)+6);
  const X=v=>padL+((lx(v)-x0)/(x1-x0||1))*plotW;
  const Y=v=>padT+plotH-((v-ymin)/(ymax-ymin||1))*plotH;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,role:'img',class:'chartsvg'});
  for(let i=0;i<=4;i++){
    const v=ymin+(ymax-ymin)*i/4;
    mk('line',{x1:padL,x2:W-padR,y1:Y(v),y2:Y(v),stroke:'var(--grid)','stroke-width':1},svg);
    mk('text',{x:padL-8,y:Y(v)+4,'text-anchor':'end',fill:'var(--muted)','font-size':11,
      'font-variant-numeric':'tabular-nums'},svg).textContent=v.toFixed(0)+'%';
  }
  for(let e=Math.ceil(x0);e<=Math.floor(x1);e++){
    const v=Math.pow(10,e);
    mk('line',{x1:X(v),x2:X(v),y1:padT,y2:padT+plotH,stroke:'var(--grid)','stroke-width':1},svg);
    mk('text',{x:X(v),y:H-padB+18,'text-anchor':'middle',fill:'var(--muted)',
      'font-size':11,'font-variant-numeric':'tabular-nums'},svg)
      .textContent=opts.xfmt?opts.xfmt(v):v.toFixed(0);
  }
  mk('text',{x:padL+plotW/2,y:H-8,'text-anchor':'middle',fill:'var(--ink2)',
    'font-size':11.5},svg).textContent=(opts.xlabel||'')+' — шкала логарифмическая';
  // подписи не должны наезжать: раздвигаем по вертикали сверху вниз
  const placed=pts.map(p=>({p,x:X(p.x),y:Y(p.y),ly:Y(p.y)}))
    .sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<placed.length;i++)
    if(placed[i].ly-placed[i-1].ly<13 && Math.abs(placed[i].x-placed[i-1].x)<110)
      placed[i].ly=placed[i-1].ly+13;
  placed.forEach(({p,x,y,ly})=>{
    // форма кодирует «влезает на сервер», цвет остаётся одним тоном
    const g=mk('g',{},svg);
    mk('circle',{cx:x,cy:y,r:12,fill:'transparent'},g);   // зона наведения ≥24px
    mk('circle',{cx:x,cy:y,r:6,fill:p.fits?'var(--s1)':'var(--surface)',
      stroke:'var(--s1)','stroke-width':2},g);
    if(Math.abs(ly-y)>2)
      mk('line',{x1:x+7,y1:y,x2:x+11,y2:ly-4,stroke:'var(--axis)','stroke-width':1},g);
    mk('text',{x:x+13,y:ly+4,fill:'var(--ink2)','font-size':11.5},g).textContent=p.label;
    bindTip(g,`<b>${esc(p.label)}</b><br>${esc(opts.ylabel||'качество')}: ${fmt(p.y)}%`
      +`<br>${esc(opts.xlabel||'x')}: ${opts.xfmt?opts.xfmt(p.x):fmt(p.x,3)}`
      +`<br>${p.fits?'влезает на сервер 4×A16':'на сервер НЕ влезает'}`
      +(p.note?`<br><span style="color:var(--muted)">${esc(p.note)}</span>`:''));
  });
  mk('line',{x1:padL,x2:W-padR,y1:Y(ymin),y2:Y(ymin),stroke:'var(--axis)','stroke-width':1},svg);
  return svg;
}

// ── ЛИНИЯ: прогресс во времени ────────────────────────────────────────
function lineChart(series, labels, opts){
  opts=opts||{};
  const W=760,H=opts.h||250,padL=52,padR=16,padT=16,padB=54;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const all=series.flatMap(s=>s.values.filter(v=>v!==null&&v!==undefined));
  const ymax=opts.max||Math.min(100,Math.max(...all)*1.1||100);
  const ymin=opts.min!==undefined?opts.min:Math.max(0,Math.min(...all)-8);
  const X=i=>padL+(labels.length<2?plotW/2:(i/(labels.length-1))*plotW);
  const Y=v=>padT+plotH-((v-ymin)/(ymax-ymin||1))*plotH;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,role:'img',class:'chartsvg'});
  for(let i=0;i<=4;i++){
    const v=ymin+(ymax-ymin)*i/4;
    mk('line',{x1:padL,x2:W-padR,y1:Y(v),y2:Y(v),stroke:'var(--grid)','stroke-width':1},svg);
    mk('text',{x:padL-8,y:Y(v)+4,'text-anchor':'end',fill:'var(--muted)','font-size':11,
      'font-variant-numeric':'tabular-nums'},svg).textContent=v.toFixed(0)+'%';
  }
  labels.forEach((l,i)=>{
    const t=mk('text',{x:X(i),y:H-padB+16,'text-anchor':'middle',fill:'var(--muted)',
      'font-size':10.5},svg);
    String(l).split('\n').forEach((part,pi)=>
      mk('tspan',{x:X(i),dy:pi?11:0},t).textContent=part);
  });
  series.forEach((s,si)=>{
    const pts=s.values.map((v,i)=>v===null||v===undefined?null:[X(i),Y(v)]).filter(Boolean);
    if(pts.length>1)
      mk('path',{d:'M'+pts.map(p=>p.join(' ')).join(' L '),fill:'none',
        stroke:S[si%3],'stroke-width':2,'stroke-linejoin':'round',
        'stroke-linecap':'round'},svg);
    s.values.forEach((v,i)=>{
      if(v===null||v===undefined)return;
      const g=mk('g',{},svg);
      mk('circle',{cx:X(i),cy:Y(v),r:10,fill:'transparent'},g);
      mk('circle',{cx:X(i),cy:Y(v),r:4.5,fill:S[si%3],
        stroke:'var(--surface)','stroke-width':2},g);
      bindTip(g,`<b>${esc(s.name)}</b><br>${esc(labels[i]).replace(/\n/g,' ')}: ${fmt(v)}%`);
    });
    // прямая подпись у последней точки
    const last=s.values.map((v,i)=>[v,i]).filter(([v])=>v!==null&&v!==undefined).pop();
    if(last) mk('text',{x:X(last[1])+8,y:Y(last[0])+4,fill:'var(--ink2)',
      'font-size':11},svg).textContent=s.name;
  });
  mk('line',{x1:padL,x2:W-padR,y1:Y(ymin),y2:Y(ymin),stroke:'var(--axis)','stroke-width':1},svg);
  return svg;
}
function legend(items){
  const d=document.createElement('div'); d.className='legend';
  d.innerHTML=items.map((it,i)=>
    `<span><i style="background:${it.color||S[i%3]}"></i>${esc(it.name)}</span>`).join('');
  return d;
}

    model:a.model,v:a.time/a.pages}));
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<h2>Скорость обработки</h2>'
   +'<p class=hint>Секунд на страницу — суммарно по всем прогонам модели. Меньше лучше.</p>';
  if(spp.length){
    const mx=Math.max(...spp.map(s=>s.v));
    c.appendChild(groupedBars(spp.map(s=>s.model.replace(/-/g,' ')),
      [{name:'сек/стр',values:spp.map(s=>s.v)}],{max:Math.ceil(mx*1.1),h:260}));
  }
  p.appendChild(c);

  const c2=document.createElement('div');c2.className='card';
  c2.innerHTML='<h2>Журнал прогонов</h2><div class=ctl>'
    +'<label>Модель: <select id=fm><option value="">все</option>'
    +models.map(m=>`<option>${esc(m)}</option>`).join('')+'</select></label>'
    +'<span class=mut id=tsum></span></div>';
  const host=document.createElement('div');c2.appendChild(host);p.appendChild(c2);
  function render(){
    const f=$('#fm').value;
    const rows=RUNS.filter(r=>!f||r.model===f).map(r=>({stamp:r.stamp,model:r.model,
      pages:r.pages,n:r.n_pages,elapsed:r.elapsed,spp:r.sec_per_page,calls:r.calls,
      tok:r.total,cost:r.cost}));
    host.innerHTML='';host.appendChild(table(rows,[
      {k:'stamp',t:'Когда (UTC)'},{k:'model',t:'Модель'},{k:'pages',t:'Страницы'},
      {k:'elapsed',t:'Время',num:1,f:v=>secs(v)},
      {k:'spp',t:'Сек/стр',num:1,f:v=>fmt(v,1)},{k:'calls',t:'Вызовов',num:1},
      {k:'tok',t:'Токенов',num:1,f:v=>(v/1000).toFixed(1)+'k'},
      {k:'cost',t:'Оценка $',num:1,f:v=>money(v)},
    ],'stamp'));
    const tt=rows.reduce((s,r)=>s+r.elapsed,0),tp=rows.reduce((s,r)=>s+r.n,0);
    $('#tsum').textContent=`— ${rows.length} прогонов, ${secs(tt)}, ${tp} страниц,`
      +` в среднем ${tp?(tt/tp).toFixed(1):0} с/стр`;
  }
  render();$('#fm').onchange=render;
}

// ── Сравнение ─────────────────────────────────────────────────────────
{
  const p=$('#pane-compare');
  const opts=RUNS.map((r,i)=>`<option value="${i}">${esc(r.stamp)} · ${esc(r.model)} · стр ${esc(r.pages)}</option>`).join('');
  p.innerHTML=`<div class=card><h2>Сравнить два прогона</h2>
   <p class=hint>Зелёным отмечено улучшение, красным ухудшение. Для времени, токенов и
   стоимости лучше меньше, для метрик качества — больше.</p>
   <div class=ctl><label>A: <select id=ca>${opts}</select></label>
   <label>B: <select id=cb>${opts}</select></label></div>
   <div id=cmpchart></div><div id=cmpout></div></div>`;
  const M=[['Слова',r=>r.pdftext?.avg?.token_recall],['Числа',r=>r.pdftext?.avg?.num_recall],
    ['Точность чисел',r=>r.pdftext?.avg?.num_precision],['Коды',r=>r.pdftext?.avg?.code_recall]];
  const T=[['Сек/стр',r=>r.sec_per_page,1],['Токенов',r=>r.total,1],['Оценка $',r=>r.cost,1]];
  function render(){
    const a=RUNS[+$('#ca').value],b=RUNS[+$('#cb').value];
    if(!a||!b)return;
    const ch=$('#cmpchart');ch.innerHTML='';
    const series=[{name:'A · '+a.model,values:M.map(([,f])=>f(a)??null)},
      {name:'B · '+b.model,values:M.map(([,f])=>f(b)??null)}];
    if(series.some(s=>s.values.some(v=>v!==null))){
      ch.appendChild(legend(series));
      ch.appendChild(groupedBars(M.map(([t])=>t),series,{max:100,h:250}));
    }
    const line=(name,x,y,inv)=>{
      let d=null,cls='mut';
      if(x!==null&&x!==undefined&&y!==null&&y!==undefined){
        d=y-x;const better=inv?d<0:d>0;
        cls=Math.abs(d)<1e-9?'mut':(better?'ok':'badc');}
      const f=name==='Оценка $'?money:name==='Токенов'?(v=>v??'')
        :(v=>v===null||v===undefined?'н/д':fmt(v,1));
      return `<tr><td>${name}</td><td class=num>${f(x)}</td><td class=num>${f(y)}</td>
        <td class="num ${cls}">${d===null?'':(d>0?'+':'')+(+d).toFixed(name==='Токенов'?0:2)}</td></tr>`;
    };
    $('#cmpout').innerHTML=`<div class=scroll><table>
      <thead><tr><th>Показатель</th><th class=num>A</th><th class=num>B</th>
      <th class=num>Δ (B−A)</th></tr></thead><tbody>`
      +M.map(([t,f])=>line(t,f(a),f(b),false)).join('')
      +T.map(([t,f,inv])=>line(t,f(a),f(b),inv)).join('')
      +`</tbody></table></div>
      <p class=hint>A = ${esc(a.run)}<br>B = ${esc(b.run)}</p>`;
  }
  $('#ca').selectedIndex=Math.max(0,RUNS.length-2);
  $('#cb').selectedIndex=Math.max(0,RUNS.length-1);
  $('#ca').onchange=render;$('#cb').onchange=render;render();
}

// ── Журнал ────────────────────────────────────────────────────────────
{
  const p=$('#pane-log');
  const items=(DATA.log||[]).slice().reverse().map(e=>
    `<li><div class=t>${esc(e.time||'')}</div><div>${esc(e.text)}</div>
     ${e.effect?`<div class="e ${e.good===false?'badc':'ok'}">${esc(e.effect)}</div>`:''}</li>`).join('');
  p.innerHTML=`<div class=card><h2>Что менялось в алгоритме</h2>
    <p class=hint>Сверху — самое свежее.</p>
    <ul class=log>${items||'<li class=mut>пусто</li>'}</ul></div>`;
}
</script>
