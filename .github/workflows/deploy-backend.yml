# Автодеплой бэкенда ПТО на сервер.
#
# Что делает: заходит по SSH и запускает deploy/deploy.sh, который забирает
# свежий код, пересобирает образ и пересоздаёт контейнер. Вся специфика
# проекта — в скрипте, здесь только доставка.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      адрес сервера
#   DEPLOY_USER      пользователь для деплоя (НЕ root)
#   DEPLOY_SSH_KEY   приватный ключ этого пользователя, целиком, с заголовками
#   DEPLOY_PORT      порт SSH, если не 22            (переменная, не секрет)
#   DEPLOY_PATH      путь до клона на сервере         (переменная, не секрет)
#
# Правки в *.md службу не перезапускают: прогон документа идёт часами, ронять
# его ради опечатки в README незачем.

name: Деплой бэкенда

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"
      - "deploy/docker-compose.full.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль compose: real (рабочий) или mock (имитация)"
        type: choice
        options: [real, mock]
        default: real
      wait_for_idle:
        description: "Сколько секунд ждать окончания идущего прогона (0 — не ждать)"
        type: string
        default: "0"

# Два деплоя подряд не должны пересобирать образ одновременно на одной машине.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Нужен, чтобы передать короткий GITHUB_TOKEN на сервер для git fetch
    # по HTTPS — без Deploy key на стороне GitHub.
    permissions:
      contents: read

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      # Пока секреты не заведены, деплой пропускается, а не падает. Иначе
      # вкладка Actions краснела бы на каждый коммит и перестала что-либо
      # значить ещё до первого настоящего деплоя.
      - name: Проверить, заведены ли доступы
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$DEPLOY_SSH_KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "### Деплой пропущен" >> "$GITHUB_STEP_SUMMARY"
            echo "Не заведены секреты:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Что и куда добавить — в deploy/README.md, раздел 2." >> "$GITHUB_STEP_SUMMARY"
            echo "Секреты деплоя не заведены ($missing) — пропускаю. Это не поломка."
          fi
          exit 0

      - name: Положить ключ и узнать хост
        if: steps.guard.outputs.skip != 'yes'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Без known_hosts ssh спросит подтверждение и повиснет.
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Обновить бэкенд на сервере
        if: steps.guard.outputs.skip != 'yes'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pto/backend' }}
          PROFILE: ${{ inputs.profile || 'real' }}
          WAIT_FOR_IDLE: ${{ inputs.wait_for_idle || '0' }}
          # Токен не кладём в argv ssh (видно в ps) — первой строкой в stdin.
          PTO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            printf '%s\n' "$PTO_GITHUB_TOKEN"
            cat deploy/deploy.sh
          } | ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "read -r PTO_GITHUB_TOKEN; export PTO_GITHUB_TOKEN; \
               export PTO_BACKEND_DIR='$DEPLOY_PATH' \
                      PTO_PROFILE='$PROFILE' \
                      PTO_DEPLOY_REF='origin/${{ github.ref_name }}' \
                      PTO_DEPLOY_WAIT='$WAIT_FOR_IDLE'; \
               bash -s"

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy
