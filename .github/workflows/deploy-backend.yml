# Автодеплой бэкенда ПТО на сервер.
#
# Что делает: заходит по SSH и запускает deploy/deploy.sh, который забирает
# свежий код, пересобирает образ и пересоздаёт контейнер. Вся специфика
# проекта — в скрипте, здесь только доставка.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      адрес сервера
#   DEPLOY_USER      пользователь для деплоя (НЕ root)
#   DEPLOY_SSH_KEY   приватный ключ этого пользователя, целиком, с заголовками
#   DEPLOY_PORT      порт SSH, если не 22            (переменная, не секрет)
#   DEPLOY_PATH      путь до клона на сервере         (переменная, не секрет)
#
# Правки в *.md службу не перезапускают: прогон документа идёт часами, ронять
# его ради опечатки в README незачем.

name: Деплой бэкенда

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"
      - "deploy/docker-compose.full.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль compose: real (рабочий) или mock (имитация)"
        type: choice
        options: [real, mock]
        default: real
      wait_for_idle:
        description: "Сколько секунд ждать окончания идущего прогона (0 — не ждать)"
        type: string
        default: "0"

# Два деплоя подряд не должны пересобирать образ одновременно на одной машине.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # Конвертер DWG собирается здесь, а не на сервере. На сервере эта сборка не
  # доходила до конца: на файле decode2.c машина уходила в своп и обрывала
  # SSH-сессию деплоя вместе со сборкой. Здесь памяти хватает, а результат
  # переиспользуется — при неизменной версии LibreDWG всё берётся из кэша и
  # шаг занимает меньше минуты.
  dwgtools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Собрать имя образа
        id: meta
        run: |
          # GHCR принимает только строчные буквы в пути образа.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="$(grep -m1 '^ARG LIBREDWG_VERSION=' Dockerfile.dwgtools | cut -d= -f2)"
          echo "image=ghcr.io/${owner}/pto-dwgtools:${version}" >> "$GITHUB_OUTPUT"

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Настроить buildx
        uses: docker/setup-buildx-action@v3

      - name: Собрать и опубликовать конвертер
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dwgtools
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Тесты пути текста и таблиц, сборки листа, очереди и разбора чертежа —
  # без модели и без конвертера DWG. Деплой идёт только после них: правка
  # таблиц 28.08 показала, что регрессия иначе уезжает на прод за две
  # минуты незамеченной.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Тесты
        env:
          PTO_PIPELINE_MODE: mock
        run: python -m pytest -q tests

  deploy:
    runs-on: ubuntu-latest
    needs: [dwgtools, tests]
    timeout-minutes: 30
    # Нужен, чтобы передать короткий GITHUB_TOKEN на сервер: тем же токеном
    # сервер делает git fetch по HTTPS (без Deploy key на стороне GitHub) и
    # забирает образ конвертера из GHCR — пакет приватный, как и репозиторий.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      # Пока секреты не заведены, деплой пропускается, а не падает. Иначе
      # вкладка Actions краснела бы на каждый коммит и перестала что-либо
      # значить ещё до первого настоящего деплоя.
      - name: Проверить, заведены ли доступы
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$DEPLOY_SSH_KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "### Деплой пропущен" >> "$GITHUB_STEP_SUMMARY"
            echo "Не заведены секреты:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Что и куда добавить — в deploy/README.md, раздел 2." >> "$GITHUB_STEP_SUMMARY"
            echo "Секреты деплоя не заведены ($missing) — пропускаю. Это не поломка."
          fi
          exit 0

      - name: Положить ключ и узнать хост
        if: steps.guard.outputs.skip != 'yes'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Без known_hosts ssh спросит подтверждение и повиснет. Ключ хоста
          # берём заранее, но не делаем на этом ставку: сервер небольшой, и
          # пока он занят сборкой образа, на SSH он отвечает не сразу. Одна
          # неудачная попытка keyscan роняла весь деплой — с этого начиналась
          # половина красных прогонов.
          #
          # Поэтому: несколько попыток с паузой, а если ключ так и не пришёл —
          # не падаем, а идём дальше с accept-new. Доверия это не убавляет:
          # keyscan точно так же берёт ключ у того, кто ответил, ничего не
          # проверяя. Настоящая неудача вскроется на следующем шаге, где уже
          # будет видно, что именно ответил сервер.
          got_key=""
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" \
                 >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
              got_key="yes"
              break
            fi
            echo "Попытка $attempt: сервер не отдал ключ хоста, жду 15 секунд."
            sleep 15
          done
          if [ -z "$got_key" ]; then
            echo "За пять попыток ключ хоста получить не удалось."
            echo "Вывод последней попытки:"
            cat /tmp/keyscan.err || true
            echo "Продолжаю с StrictHostKeyChecking=accept-new."
            echo "PTO_SSH_ACCEPT_NEW=yes" >> "$GITHUB_ENV"
            {
              echo "### Ключ хоста не получен заранее"
              echo "Сервер не ответил на SSH по порту $DEPLOY_PORT за пять попыток."
              echo "Если деплой упал следом — проверьте, что машина поднята,"
              echo "порт открыт (задаётся переменной DEPLOY_PORT) и вход не"
              echo "заблокирован fail2ban после неудачных попыток."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Обновить бэкенд на сервере
        if: steps.guard.outputs.skip != 'yes'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pto/backend' }}
          PROFILE: ${{ inputs.profile || 'real' }}
          WAIT_FOR_IDLE: ${{ inputs.wait_for_idle || '0' }}
          # Токен не кладём в argv ssh (видно в ps) — первой строкой в stdin.
          PTO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          # accept-new включается только если ключ не удалось взять заранее.
          # Он не спрашивает подтверждения (в отличие от «ask»), поэтому
          # деплой не повиснет молча в ожидании ввода.
          host_check="yes"
          if [ "${PTO_SSH_ACCEPT_NEW:-}" = "yes" ]; then
            host_check="accept-new"
          fi
          {
            printf '%s\n' "$PTO_GITHUB_TOKEN"
            cat deploy/deploy.sh
          } | ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o ServerAliveInterval=30 \
              -o StrictHostKeyChecking="$host_check" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "read -r PTO_GITHUB_TOKEN; export PTO_GITHUB_TOKEN; \
               export PTO_BACKEND_DIR='$DEPLOY_PATH' \
                      PTO_PROFILE='$PROFILE' \
                      PTO_DEPLOY_REF='origin/${{ github.ref_name }}' \
                      PTO_DEPLOY_WAIT='$WAIT_FOR_IDLE'; \
               bash -s"

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy
